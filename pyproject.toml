[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titanic-agent"
version = "0.1.0"
description = "Opal + Stitch + Notion automation flow: raw idea -> PRD -> Notion -> Stitch UI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "jacattac314" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-ai>=0.0.14",
  "requests>=2.31",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "responses>=0.25",
  "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["titanic_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
